<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>橙子背诵 🍊</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">🍊 橙子背诵</div>
    <div class="header-actions">
      <button class="hdr-btn" id="btnCloze" title="挖空测试模式">🔍 测试</button>
      <button class="hdr-btn" id="btnDark" title="夜间/护眼模式">🌙</button>
      <button class="hdr-btn" id="btnExport" title="备份背诵进度">📤 备份</button>
      <button class="hdr-btn" id="btnImport" title="恢复背诵进度" onclick="document.getElementById('importFile').click()">📥 恢复</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <div class="countdown" id="countdown">距离高考 loading…</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <input id="search" class="search" type="search" placeholder="搜索知识点 / 关键词…" />
  </div>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="clozeBar" class="cloze-bar" style="display:none">
    <span>🔍 挖空测试模式</span>
    <span id="clozeStats"></span>
    <button class="hdr-btn" id="btnClozeOff">退出测试</button>
  </div>

  <main id="cards" class="cards"></main>

  <footer class="site-footer">
    <span>单击卡片查看详情 · 右键切换已背/未背</span>
    <span id="progress"></span>
  </footer>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle"></h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
